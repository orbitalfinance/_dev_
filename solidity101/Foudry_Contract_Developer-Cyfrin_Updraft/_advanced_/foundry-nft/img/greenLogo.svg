<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Exact shape kept -->
    <path id="crescentShape" d="
      M 479 228
      C 455 232, 438 236, 422 241
      C 400 248, 384 257, 370 265
      C 350 277, 337 287, 328 296
      C 309 315, 293 336, 280 354
      C 302 335, 321 320, 340 307
      C 360 294, 382 284, 403 279
      C 416 275, 430 272, 440 270
      C 468 266, 493 266, 513 268
      C 522 269, 531 270, 538 272
      C 556 276, 574 282, 586 288
      C 600 294, 612 301, 620 308
      C 645 327, 664 348, 677 367
      C 685 379, 691 390, 694 397
      C 702 413, 707 429, 709 441
      C 715 463, 717 479, 717 485
      C 718 495, 718 505, 716 515
      C 714 534, 710 552, 705 564
      C 699 580, 692 595, 684 607
      C 675 621, 663 636, 650 647
      C 641 656, 630 664, 619 670
      C 609 676, 597 682, 587 686
      C 571 692, 555 696, 539 698
      C 524 701, 509 701, 497 700
      C 481 699, 465 696, 453 692
      C 439 689, 426 684, 416 678
      C 402 672, 391 664, 381 656
      C 366 644, 354 631, 346 620
      C 334 605, 326 591, 322 581
      C 315 562, 312 545, 311 535
      C 309 522, 309 511, 310 502
      C 311 486, 314 473, 319 461
      C 324 449, 331 437, 339 427
      C 350 414, 363 400, 374 391
      C 388 380, 401 374, 409 372
      C 395 373, 384 375, 375 378
      C 359 382, 344 388, 334 396
      C 321 403, 311 410, 305 417
      C 292 429, 283 440, 278 448
      C 270 459, 265 469, 262 476
      C 255 493, 250 511, 248 522
      C 246 539, 246 558, 248 574
      C 252 598, 258 618, 266 632
      C 272 647, 281 661, 290 671
      C 298 682, 308 694, 318 703
      C 332 717, 350 731, 366 740
      C 383 751, 400 759, 414 764
      C 435 772, 456 777, 474 780
      C 492 782, 508 783, 521 782
      C 535 782, 550 780, 563 778
      C 587 773, 612 765, 628 758
      C 642 752, 654 746, 664 739
      C 681 728, 697 717, 709 704
      C 721 693, 731 682, 738 672
      C 748 659, 757 644, 764 630
      C 773 611, 779 594, 782 584
      C 789 560, 792 543, 792 532
      C 794 510, 793 488, 791 470
      C 789 452, 785 437, 781 424
      C 775 404, 766 386, 758 371
      C 749 352, 736 335, 723 322
      C 710 307, 696 294, 682 284
      C 664 271, 643 258, 626 251
      C 610 243, 594 239, 583 236
      C 569 232, 554 229, 542 228
      C 519 226, 496 226, 479 228
      Z"/>

    <clipPath id="crescentClip">
      <use href="#crescentShape"/>
    </clipPath>

    <!-- Green body color -->
    <linearGradient id="bodyGradient" x1="305" y1="250" x2="780" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b8ff5a"/>
      <stop offset="9%" stop-color="#63ff38"/>
      <stop offset="24%" stop-color="#1eff2a"/>
      <stop offset="48%" stop-color="#00db19"/>
      <stop offset="76%" stop-color="#009d10"/>
      <stop offset="100%" stop-color="#003f06"/>
    </linearGradient>

    <!-- Soft hot green wash -->
    <radialGradient id="hotWash" cx="40%" cy="34%" r="68%">
      <stop offset="0%" stop-color="#e7ffad" stop-opacity="0.30"/>
      <stop offset="18%" stop-color="#9cff5f" stop-opacity="0.22"/>
      <stop offset="38%" stop-color="#39ff3e" stop-opacity="0.13"/>
      <stop offset="65%" stop-color="#00ff2a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </radialGradient>

    <!-- Darker emerald weighting toward the lower-right arc -->
    <linearGradient id="shadowWash" x1="360" y1="260" x2="805" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="52%" stop-color="#001400" stop-opacity="0.06"/>
      <stop offset="78%" stop-color="#002200" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#001000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Mottled solar texture -->
    <filter id="surfaceTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="4" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0.10 0 0 0 0
                0 1.00 0 0 0
                0 0 0.15 0 0
                0 0 0 0.52 0" result="greenNoise"/>
      <feGaussianBlur in="greenNoise" stdDeviation="0.6" result="softNoise"/>
      <feBlend in="SourceGraphic" in2="softNoise" mode="overlay"/>
    </filter>

    <!-- Glow around the crescent -->
    <filter id="outerGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur2"/>
      <feFlood flood-color="#27ff39" flood-opacity="0.95" result="glowColor1"/>
      <feFlood flood-color="#00a81c" flood-opacity="0.42" result="glowColor2"/>
      <feComposite in="glowColor1" in2="blur1" operator="in" result="glow1"/>
      <feComposite in="glowColor2" in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow2"/>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>

  <g filter="url(#outerGlow)">
    <!-- Base fill -->
    <use href="#crescentShape" fill="#00c917"/>

    <!-- Color + texture clipped to the exact shape -->
    <g clip-path="url(#crescentClip)">
      <rect width="1024" height="1024" fill="url(#bodyGradient)"/>
      <rect width="1024" height="1024" fill="url(#hotWash)"/>
      <rect width="1024" height="1024" fill="url(#shadowWash)"/>
      <rect width="1024" height="1024" fill="url(#bodyGradient)" filter="url(#surfaceTexture)" opacity="0.92"/>

      <!-- Bright top highlight -->
      <path
        d="M 280 354
           C 394 249, 629 239, 760 327
           C 623 271, 417 269, 280 354 Z"
        fill="#d9ff9a"
        opacity="0.14"/>

      <!-- Slight lower-left warm patch -->
      <path
        d="M 255 486
           C 282 424, 335 386, 409 372
           C 332 422, 293 507, 302 598
           C 309 662, 348 726, 414 764
           C 322 726, 258 628, 255 486 Z"
        fill="#9dff73"
        opacity="0.10"/>

      <!-- Lower-right deeper green mass -->
      <path
        d="M 664 739
           C 739 670, 781 571, 791 470
           C 800 583, 752 689, 664 739 Z"
        fill="#002d06"
        opacity="0.16"/>
    </g>

    <!-- Very subtle rim brightness -->
    <use href="#crescentShape" fill="none" stroke="#d7ffab" stroke-width="1.3" opacity="0.16"/>
    <use href="#crescentShape" fill="none" stroke="#54ff5e" stroke-width="2.2" opacity="0.20"/>
  </g>
</svg>